<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettre de motivation express</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--bd:#dcdad2;--ac:#2f5d50;--act:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#202220;--tx:#ecebe6;--mut:#9a9890;--bd:#3a3c38;--ac:#7fc4ae;--act:#10201b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 5px}
label:first-child{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:90px}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:var(--act)}
button.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
#out{white-space:pre-wrap;line-height:1.65}
.err{color:#b3261e;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Lettre de motivation express</h1>
  <p class="sub">Remplis les champs, clique sur « Créer » et l’IA rédige ta lettre.</p>

  <div class="card">
    <label for="job">Métier</label>
    <input id="job" maxlength="120" placeholder="Ex. : Vendeur, développeur, infirmier…">
    <label for="co">Entreprise</label>
    <input id="co" maxlength="120" placeholder="Ex. : Migros, Swisscom…">
    <label for="det">Détails à ajouter</label>
    <textarea id="det" maxlength="2000" placeholder="Ton parcours, tes qualités, ta motivation, ce que tu sais faire…"></textarea>
    <div class="row"><button id="create">Créer</button></div>
    <div class="err" id="err" hidden></div>
  </div>

  <div class="card" id="res" hidden>
    <div id="out"></div>
    <div class="row"><button class="sec" id="copy">Copier</button></div>
    <hr style="border:0;border-top:1px solid var(--bd);margin:18px 0">
    <label for="prec">Ajouter des précisions</label>
    <textarea id="prec" maxlength="600" placeholder="Ex. : plus court, ton plus formel, mentionner mon stage…"></textarea>
    <div class="row"><button id="redo">Refaire une version</button></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const showErr = m => { $("err").textContent = m; $("err").hidden = !m; };

async function generate(redo) {
  showErr("");
  const job = $("job").value.trim(), company = $("co").value.trim();
  if (!job || !company) { showErr("Indique au moins le métier et l’entreprise."); return; }

  const payload = { job, company, details: $("det").value.trim() };
  if (redo) {
    payload.previous = $("out").textContent;
    payload.precisions = $("prec").value.trim();
  }

  const btns = [$("create"), $("redo")];
  btns.forEach(b => b.disabled = true);
  const old = $("out").textContent;
  $("res").hidden = false;
  $("out").textContent = "Rédaction en cours…";

  try {
    const r = await fetch("/api/lettre", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.letter) throw new Error(data.error || "Erreur");
    $("out").textContent = data.letter;
    $("prec").value = "";
    $("res").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    showErr(e.message || "Une erreur est survenue, réessaie.");
    $("out").textContent = old;
    if (!old) $("res").hidden = true;
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

$("create").onclick = () => generate(false);
$("redo").onclick = () => generate(true);
$("copy").onclick = async () => {
  const t = $("out").textContent, b = $("copy");
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const a = document.createElement("textarea");
    a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } catch (_) {}
    a.remove();
  }
  b.textContent = "Copié ✓";
  setTimeout(() => b.textContent = "Copier", 1600);
};
</script>
</body>
</html>
